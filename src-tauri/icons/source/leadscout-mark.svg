<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!--
    LeadScout mark — "radar signal": concentric arcs sweeping from an
    origin point, with a highlighted dot on the outer ring standing in
    for a discovered business. Single flat currentColor fill/stroke only
    — see DESIGN.md's Logo & Branding section. No hardcoded color here;
    callers set color via CSS (`text-primary`/`text-foreground`, never a
    new hue) or, for the static app-icon PNG export, an explicit ink.
  -->
  <g stroke-linecap="round">
    <g fill="none" stroke="currentColor" stroke-width="48">
      <polyline points="200,604 256.9,611.5 310,633.5 355.6,668.4 390.5,714 412.5,767.1 420,824"/>
      <polyline points="200,424 303.5,437.6 400,477.6 482.8,541.2 546.4,624 586.4,720.5 600,824"/>
      <polyline points="200,244 350.1,263.8 490,321.7 610.1,413.9 702.3,534 760.2,673.9 780,824"/>
    </g>
    <circle fill="currentColor" cx="200" cy="824" r="45"/>
    <circle fill="currentColor" cx="610.1" cy="413.9" r="58"/>
  </g>
</svg>
